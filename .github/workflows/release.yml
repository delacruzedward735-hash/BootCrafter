name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3 python3-tk xvfb xauth dpkg-dev

      - name: Verify version and source
        shell: bash
        run: |
          set -euo pipefail
          chmod +x INSTALL.sh scripts/*.sh
          VERSION="$(python3 -c 'from bootcrafter_linux import __version__; print(__version__)')"
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" && "${GITHUB_REF_NAME}" != "v${VERSION}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match application version v${VERSION}." >&2
            exit 1
          fi
          ./scripts/verify.sh

      - name: Build and audit package
        run: |
          ./scripts/build-deb.sh
          ./scripts/audit-package.sh
          sha256sum dist/bootcrafter-linux_*_all.deb > dist/SHA256SUMS.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: bootcrafter-linux-release
          path: |
            dist/bootcrafter-linux_*_all.deb
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/bootcrafter-linux_*_all.deb \
            dist/SHA256SUMS.txt \
            --verify-tag \
            --title "BootCrafter Linux ${GITHUB_REF_NAME#v}" \
            --generate-notes
